<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors *;">
  <meta http-equiv="Access-Control-Allow-Origin" content="*">
  <title>Simple US Map</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson@3"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }
    
    #map-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .state {
      stroke: #fff;
      stroke-width: 1px;
    }
    
    .state:hover {
      stroke-width: 2px;
      stroke: #333;
      cursor: pointer;
    }
    
    .tooltip {
      position: absolute;
      background: white;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .tooltip h3 {
      margin: 0 0 5px 0;
      font-size: 16px;
    }
    
    .tooltip p {
      margin: 5px 0;
      font-size: 14px;
    }
    
    .legend {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(255,255,255,0.9);
      border-radius: 5px;
      padding: 10px;
      font-size: 12px;
    }
    
    .legend-title {
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .color-scale {
      display: flex;
      height: 20px;
      width: 200px;
    }
    
    .color-box {
      flex: 1;
      height: 100%;
    }
    
    .scale-labels {
      display: flex;
      justify-content: space-between;
      width: 200px;
    }
  </style>
</head>
<body>
  <div id="map-container"></div>
  
  <script>
    async function createMap() {
      // Load US TopoJSON
      const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json");
      
      // Create a sample dataset with values for each state
      // In a real application, this would come from your database
      const sampleData = [
        { state: "AL", value: 45, fullName: "Alabama" },
        { state: "AK", value: 65, fullName: "Alaska" },
        { state: "AZ", value: 75, fullName: "Arizona" },
        { state: "AR", value: 35, fullName: "Arkansas" },
        { state: "CA", value: 95, fullName: "California" },
        { state: "CO", value: 80, fullName: "Colorado" },
        { state: "CT", value: 70, fullName: "Connecticut" },
        { state: "DE", value: 60, fullName: "Delaware" },
        { state: "FL", value: 85, fullName: "Florida" },
        { state: "GA", value: 75, fullName: "Georgia" },
        { state: "HI", value: 90, fullName: "Hawaii" },
        { state: "ID", value: 40, fullName: "Idaho" },
        { state: "IL", value: 70, fullName: "Illinois" },
        { state: "IN", value: 55, fullName: "Indiana" },
        { state: "IA", value: 50, fullName: "Iowa" },
        { state: "KS", value: 45, fullName: "Kansas" },
        { state: "KY", value: 40, fullName: "Kentucky" },
        { state: "LA", value: 55, fullName: "Louisiana" },
        { state: "ME", value: 50, fullName: "Maine" },
        { state: "MD", value: 75, fullName: "Maryland" },
        { state: "MA", value: 80, fullName: "Massachusetts" },
        { state: "MI", value: 65, fullName: "Michigan" },
        { state: "MN", value: 60, fullName: "Minnesota" },
        { state: "MS", value: 35, fullName: "Mississippi" },
        { state: "MO", value: 50, fullName: "Missouri" },
        { state: "MT", value: 45, fullName: "Montana" },
        { state: "NE", value: 50, fullName: "Nebraska" },
        { state: "NV", value: 70, fullName: "Nevada" },
        { state: "NH", value: 55, fullName: "New Hampshire" },
        { state: "NJ", value: 80, fullName: "New Jersey" },
        { state: "NM", value: 60, fullName: "New Mexico" },
        { state: "NY", value: 90, fullName: "New York" },
        { state: "NC", value: 70, fullName: "North Carolina" },
        { state: "ND", value: 40, fullName: "North Dakota" },
        { state: "OH", value: 65, fullName: "Ohio" },
        { state: "OK", value: 50, fullName: "Oklahoma" },
        { state: "OR", value: 75, fullName: "Oregon" },
        { state: "PA", value: 70, fullName: "Pennsylvania" },
        { state: "RI", value: 65, fullName: "Rhode Island" },
        { state: "SC", value: 60, fullName: "South Carolina" },
        { state: "SD", value: 35, fullName: "South Dakota" },
        { state: "TN", value: 55, fullName: "Tennessee" },
        { state: "TX", value: 85, fullName: "Texas" },
        { state: "UT", value: 65, fullName: "Utah" },
        { state: "VT", value: 50, fullName: "Vermont" },
        { state: "VA", value: 70, fullName: "Virginia" },
        { state: "WA", value: 80, fullName: "Washington" },
        { state: "WV", value: 35, fullName: "West Virginia" },
        { state: "WI", value: 55, fullName: "Wisconsin" },
        { state: "WY", value: 40, fullName: "Wyoming" }
      ];
      
      // Create a color scale
      const colorScale = d3.scaleLinear()
        .domain([30, 100])
        .range(["#e5f5e0", "#31a354"]);
      
      // Set up the map dimensions
      const width = window.innerWidth;
      const height = window.innerHeight;
      
      // Create SVG element
      const svg = d3.select("#map-container")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", `0 0 ${width} ${height}`)
        .attr("preserveAspectRatio", "xMidYMid meet");
      
      // Create a tooltip
      const tooltip = d3.select("#map-container")
        .append("div")
        .attr("class", "tooltip");
      
      // Create a projection and path
      const projection = d3.geoAlbersUsa()
        .translate([width / 2, height / 2])
        .scale(width);
      
      const path = d3.geoPath()
        .projection(projection);
      
      // Draw states
      svg.append("g")
        .selectAll("path")
        .data(topojson.feature(us, us.objects.states).features)
        .enter()
        .append("path")
        .attr("class", "state")
        .attr("d", path)
        .attr("fill", d => {
          const stateInfo = sampleData.find(s => s.state === getStateCode(d.properties.name));
          return stateInfo ? colorScale(stateInfo.value) : "#ccc";
        })
        .on("mouseover", function(event, d) {
          const stateInfo = sampleData.find(s => s.state === getStateCode(d.properties.name));
          
          if (stateInfo) {
            d3.select(this).attr("stroke-width", "2px").attr("stroke", "#333");
            
            tooltip
              .style("opacity", 1)
              .style("left", (event.pageX + 10) + "px")
              .style("top", (event.pageY - 28) + "px")
              .html(`
                <h3>${stateInfo.fullName}</h3>
                <p>Value: ${stateInfo.value}</p>
              `);
          }
        })
        .on("mouseout", function() {
          d3.select(this).attr("stroke-width", "1px").attr("stroke", "#fff");
          tooltip.style("opacity", 0);
        });
      
      // Add legend
      const legend = svg.append("g")
        .attr("class", "legend")
        .attr("transform", `translate(${width - 220}, ${height - 70})`);
      
      // Legend background
      legend.append("rect")
        .attr("width", 200)
        .attr("height", 60)
        .attr("fill", "white")
        .attr("stroke", "#ddd")
        .attr("rx", 5);
      
      // Legend title
      legend.append("text")
        .attr("class", "legend-title")
        .attr("x", 10)
        .attr("y", 20)
        .text("Sample Data");
      
      // Create color gradient
      const gradient = legend.append("defs")
        .append("linearGradient")
        .attr("id", "gradient")
        .attr("x1", "0%")
        .attr("x2", "100%")
        .attr("y1", "0%")
        .attr("y2", "0%");
      
      gradient.append("stop")
        .attr("offset", "0%")
        .attr("stop-color", colorScale.range()[0]);
      
      gradient.append("stop")
        .attr("offset", "100%")
        .attr("stop-color", colorScale.range()[1]);
      
      // Add color gradient rect
      legend.append("rect")
        .attr("x", 10)
        .attr("y", 25)
        .attr("width", 180)
        .attr("height", 15)
        .style("fill", "url(#gradient)");
      
      // Add min and max labels
      legend.append("text")
        .attr("x", 10)
        .attr("y", 55)
        .attr("text-anchor", "start")
        .style("font-size", "10px")
        .text("Low");
      
      legend.append("text")
        .attr("x", 190)
        .attr("y", 55)
        .attr("text-anchor", "end")
        .style("font-size", "10px")
        .text("High");
    }
    
    // Helper function to convert state names to state codes
    function getStateCode(stateName) {
      const stateMap = {
        "Alabama": "AL", "Alaska": "AK", "Arizona": "AZ", "Arkansas": "AR", "California": "CA",
        "Colorado": "CO", "Connecticut": "CT", "Delaware": "DE", "Florida": "FL", "Georgia": "GA",
        "Hawaii": "HI", "Idaho": "ID", "Illinois": "IL", "Indiana": "IN", "Iowa": "IA",
        "Kansas": "KS", "Kentucky": "KY", "Louisiana": "LA", "Maine": "ME", "Maryland": "MD",
        "Massachusetts": "MA", "Michigan": "MI", "Minnesota": "MN", "Mississippi": "MS", "Missouri": "MO",
        "Montana": "MT", "Nebraska": "NE", "Nevada": "NV", "New Hampshire": "NH", "New Jersey": "NJ",
        "New Mexico": "NM", "New York": "NY", "North Carolina": "NC", "North Dakota": "ND", "Ohio": "OH",
        "Oklahoma": "OK", "Oregon": "OR", "Pennsylvania": "PA", "Rhode Island": "RI", "South Carolina": "SC",
        "South Dakota": "SD", "Tennessee": "TN", "Texas": "TX", "Utah": "UT", "Vermont": "VT",
        "Virginia": "VA", "Washington": "WA", "West Virginia": "WV", "Wisconsin": "WI", "Wyoming": "WY"
      };
      return stateMap[stateName] || "";
    }
    
    // Initialize the map
    createMap();
  </script>
</body>
</html>
