<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors *;">
  <meta http-equiv="Access-Control-Allow-Origin" content="*">
  <title>US Map Visualization</title>
  <style>
    /* Reset CSS */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    #map-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: white;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="map-container">
    <!-- The iframe loads only the /embed route which shows just the map -->
    <iframe 
      src="/embed" 
      title="US Map"
      frameborder="0"
      allowfullscreen
    ></iframe>
  </div>

  <script>
    // Fix for different environments (local dev vs production)
    document.addEventListener('DOMContentLoaded', function() {
      const iframe = document.querySelector('iframe');
      const isLocalhost = 
        window.location.hostname === 'localhost' || 
        window.location.hostname === '127.0.0.1';
      
      // Set the proper source URL based on environment
      const baseUrl = isLocalhost 
        ? 'http://localhost:3000/embed'
        : 'https://map-generator-umber.vercel.app/embed';
      
      iframe.src = baseUrl;
    });
  </script>
</body>
</html>
