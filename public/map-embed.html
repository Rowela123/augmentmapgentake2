<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Map Visualization</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/topojson.v3.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    
    #map-container {
      width: 100%;
      height: 500px;
      position: relative;
    }
    
    .state {
      fill: #f0f0f0;
      stroke: #fff;
      stroke-width: 1;
      cursor: pointer;
    }
    
    .state:hover {
      opacity: 0.8;
    }
    
    .tooltip {
      position: absolute;
      background: white;
      border-radius: 5px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      padding: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      max-width: 250px;
      z-index: 1000;
    }
    
    .tooltip-header {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
    }
    
    .tooltip-content {
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="map-container"></div>
  
  <script>
    // Simple implementation of US Map
    (function() {
      // Map dimensions
      const width = document.getElementById('map-container').clientWidth;
      const height = 500;
      const margin = { top: 20, right: 20, bottom: 20, left: 20 };
      
      // Create SVG
      const svg = d3.select("#map-container")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", [0, 0, width, height])
        .attr("style", "width: 100%; height: auto;");
      
      // Create a tooltip div
      const tooltip = d3.select("body")
        .append("div")
        .attr("class", "tooltip");
      
      // Define color scale
      const colorScale = d3.scaleLinear()
        .domain([0, 100])
        .range(["#e5f5e0", "#31a354"]);
      
      // Load US map data
      Promise.all([
        d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json")
      ]).then(([us]) => {
        // Convert TopoJSON to GeoJSON
        const states = topojson.feature(us, us.objects.states);
        
        // Set up projection
        const projection = d3.geoAlbersUsa()
          .fitSize([width - margin.left - margin.right, height - margin.top - margin.bottom], states);
        
        const path = d3.geoPath()
          .projection(projection);
        
        // Draw states
        svg.append("g")
          .selectAll("path")
          .data(states.features)
          .join("path")
          .attr("class", "state")
          .attr("d", path)
          .attr("fill", d => colorScale(Math.random() * 100)) // Demo data
          .on("mouseover", function(event, d) {
            // Show tooltip
            tooltip
              .style("opacity", 1)
              .style("left", (event.pageX + 10) + "px")
              .style("top", (event.pageY - 20) + "px")
              .html(`
                <div class="tooltip-header">${d.properties.name}</div>
                <div class="tooltip-content">
                  Sample data for demonstration purposes.
                </div>
              `);
          })
          .on("mouseout", function() {
            // Hide tooltip
            tooltip.style("opacity", 0);
          });
      });
    })();
  </script>
</body>
</html>
