<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Map Embed</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #map-container {
      width: 100%;
      height: 100%;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      font-family: Arial, sans-serif;
      color: #333;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="map-container">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading map...</p>
    </div>
  </div>

  <script>
    // Get the map ID from the URL path - will be the last segment
    const pathSegments = window.location.pathname.split('/');
    const mapId = pathSegments[pathSegments.length - 1];
    
    // If no map ID is found, redirect to the main page
    if (!mapId) {
      window.location.href = '/';
    }
    
    // Load the actual embed page in an iframe
    const mapContainer = document.getElementById('map-container');
    
    // Create the iframe with the embed URL that includes all data
    const iframe = document.createElement('iframe');
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = 'none';
    iframe.setAttribute('frameborder', '0');
    iframe.setAttribute('allowfullscreen', 'true');
    
    // Set the source URL to the full embed URL with the hash ID
    iframe.src = `/embed#${mapId}`;
    
    // Replace the loading indicator with the iframe
    iframe.onload = function() {
      mapContainer.innerHTML = '';
      mapContainer.appendChild(iframe);
    };
    
    // Add the iframe to the container
    mapContainer.appendChild(iframe);
  </script>
</body>
</html>
