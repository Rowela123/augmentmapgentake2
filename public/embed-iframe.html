<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors *;">
  <meta http-equiv="Access-Control-Allow-Origin" content="*">
  <title>US Map Embed</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      z-index: 10;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading-indicator" class="loading">Loading map...</div>
  <iframe id="map-iframe" src="" frameborder="0" allowfullscreen onload="hideLoading()"></iframe>

  <script>
    // Get the map ID from the URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const mapId = urlParams.get('id');
    
    // Set the iframe src based on the map ID
    const iframe = document.getElementById('map-iframe');
    if (mapId) {
      iframe.src = `/embed?id=${mapId}`;
    } else {
      iframe.src = '/embed';
    }
    
    // Hide loading indicator once iframe is loaded
    function hideLoading() {
      document.getElementById('loading-indicator').style.display = 'none';
    }
  </script>
</body>
</html>
