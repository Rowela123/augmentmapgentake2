<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>US Map</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        .embed-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <!-- Direct iframe embed without any React router or hash (#) characters -->
    <iframe 
        src="https://map-generator-umber.vercel.app/embed" 
        class="embed-container"
        frameborder="0" 
        allowfullscreen>
    </iframe>
</body>
</html>
