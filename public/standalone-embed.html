<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Map Embed</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    #map-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="map-container">
    <!-- The map will be loaded here -->
  </div>
  
  <script>
    // Get the embed URL from the main application
    const mapUrl = "https://map-generator-umber.vercel.app/embed";
    
    // Create iframe programmatically
    const iframe = document.createElement('iframe');
    iframe.src = mapUrl;
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = 'none';
    iframe.setAttribute('allowfullscreen', 'true');
    
    // Add to the container
    document.getElementById('map-container').appendChild(iframe);
  </script>
</body>
</html>
